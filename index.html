<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4EFE4">
  <meta name="description" content="A calm focus timer for kids. Ten minutes of work, then a three-minute break.">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Star Focus">
  <title>Star Focus</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/nunito-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/nunito-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script>
    document.documentElement.classList.add('js');
    try {
      var saved = JSON.parse(localStorage.getItem('star-focus') || 'null');
      if (!saved || typeof saved !== 'object') saved = {};
      var phase = saved.phase === 'break' ? 'break' : 'work';
      var showBreak = false;
      if (phase === 'break' && saved.mode === 'paused') showBreak = true;
      if (phase === 'break' && saved.mode === 'running' && typeof saved.endsAt === 'number' && (Date.now() - saved.endsAt) < 3600000) {
        showBreak = true;
      }
      if (showBreak) {
        document.documentElement.dataset.phase = 'break';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#E4F2FB');
      }
    } catch (err) {}
  </script>
</head>
<body>
  <noscript>
    <p class="noscript">Star Focus needs JavaScript to run the countdown.</p>
  </noscript>
  <div class="app">
    <header class="top">
      <h1 class="brand">
        <svg class="brand-star" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 1.7 14.9 7.8 21.5 8.6 16.6 13.1 17.9 19.7 12 16.5 6.1 19.7 7.4 13.1 2.5 8.6 9.1 7.8Z"></path>
        </svg>
        Star Focus
      </h1>
      <div class="top-actions">
        <button type="button" class="icon-btn" id="mute" aria-pressed="false" aria-label="Turn chime off">
          <svg class="when-sound" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M4 9.5h3.1L11.2 6v12l-4.1-3.5H4z"></path>
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.2 9.1a3.8 3.8 0 0 1 0 5.8M17.6 7a6.6 6.6 0 0 1 0 10"></path>
          </svg>
          <svg class="when-muted" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M4 9.5h3.1L11.2 6v12l-4.1-3.5H4z"></path>
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9.2 21 14.2M21 9.2 16 14.2"></path>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="open-settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 8h16M4 16h16"></path>
            <circle class="knob" cx="9" cy="8" r="2.3"></circle>
            <circle class="knob" cx="15" cy="16" r="2.3"></circle>
          </svg>
        </button>
      </div>
    </header>

    <main class="body">
      <div class="phase-block">
        <p class="phase-label" id="phase-label">
          <svg class="phase-mark phase-mark-work" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="7.2" fill="none" stroke="currentColor" stroke-width="2.4"></circle>
            <circle cx="12" cy="12" r="2.6" fill="currentColor"></circle>
          </svg>
          <svg class="phase-mark phase-mark-break" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M7 17.4h10.1a3.4 3.4 0 0 0 .4-6.8 4.8 4.8 0 0 0-9.2-1.6A3.3 3.3 0 0 0 7 17.4z"></path>
          </svg>
          <span id="phase-text">Focus time</span>
        </p>
        <p class="phase-hint" id="phase-hint">One thing at a time</p>
      </div>

      <div class="dial-wrap">
        <div class="dial" id="timer" role="timer" aria-label="Focus time, 10 minutes 0 seconds remaining">
          <svg class="dial-svg" viewBox="0 0 200 200" aria-hidden="true">
            <circle class="face" cx="100" cy="100" r="78"></circle>
            <circle class="ring-track" cx="100" cy="100" r="84"></circle>
            <circle id="ring" class="ring-value" cx="100" cy="100" r="84" transform="rotate(-90 100 100)"></circle>
          </svg>
          <div class="readout" aria-hidden="true">
            <p class="time" id="time">10:00</p>
            <p class="status" id="status">Ready</p>
          </div>
        </div>
      </div>

      <div class="stars">
        <div class="star-row" id="star-row" aria-hidden="true"></div>
        <p class="star-caption" id="star-caption">No stars yet</p>
      </div>

      <div class="controls">
        <button type="button" class="btn btn-primary" id="primary">Start</button>
        <div class="secondary-row">
          <button type="button" class="btn btn-secondary" id="reset" aria-label="Reset to the start of focus time">Reset</button>
          <button type="button" class="btn btn-secondary" id="skip" aria-label="Skip to break time">Skip</button>
        </div>
      </div>
      <p class="sr-only" id="live" aria-live="polite"></p>
    </main>
  </div>

  <dialog id="settings" aria-labelledby="settings-title">
    <form class="settings-form" method="dialog">
      <h2 id="settings-title">Settings</h2>
      <div class="field">
        <label for="work-min">Focus minutes</label>
        <div class="stepper">
          <button type="button" class="step" id="work-dec" aria-label="Decrease focus minutes">−</button>
          <input id="work-min" type="number" min="1" max="60" step="1" inputmode="numeric" value="10">
          <button type="button" class="step" id="work-inc" aria-label="Increase focus minutes">+</button>
        </div>
      </div>
      <div class="field">
        <label for="break-min">Break minutes</label>
        <div class="stepper">
          <button type="button" class="step" id="break-dec" aria-label="Decrease break minutes">−</button>
          <input id="break-min" type="number" min="1" max="60" step="1" inputmode="numeric" value="3">
          <button type="button" class="step" id="break-inc" aria-label="Increase break minutes">+</button>
        </div>
      </div>
      <p class="settings-preview" id="settings-preview">Focus 10 min · Break 3 min</p>
      <div class="switch-row">
        <span id="chime-label">Chime</span>
        <button type="button" class="switch" id="chime-toggle" role="switch" aria-checked="true" aria-label="Chime on">On</button>
      </div>
      <p class="settings-note">Saved on this device. Choose 1 to 60 minutes. A running round keeps its current time; the new length is used next round.</p>
      <button type="button" class="btn btn-quiet" id="clear-stars">Clear stars</button>
      <button type="submit" class="btn btn-primary" id="settings-done">Done</button>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
